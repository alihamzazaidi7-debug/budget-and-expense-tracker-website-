<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Expense | Budget Tracker</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f4f6f9;
}

/* HEADER */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
background:#1e2a38;
color:white;
}

.logo{
font-size:24px;
font-weight:bold;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
transition:0.3s;
}

nav a:hover{
color:#00d4ff;
}

/* TITLE */

.title{
text-align:center;
padding:50px 20px;
}

.title h1{
font-size:36px;
margin-bottom:10px;
}

/* FORM */

.form-container{
width:80%;
max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.form-container input,
.form-container select{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:20px;
border:1px solid #ccc;
border-radius:5px;
}

.form-container button{
width:100%;
padding:12px;
background:#1abc9c;
border:none;
color:white;
font-size:16px;
border-radius:5px;
cursor:pointer;
}

/* TABLE */

.table-container{
width:80%;
max-width:900px;
margin:40px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
text-align:center;
border-bottom:1px solid #ddd;
}

th{
background:#1abc9c;
color:white;
}

.delete-btn{
background:red;
color:white;
border:none;
padding:6px 12px;
border-radius:4px;
cursor:pointer;
}

/* TOTAL */

.total{
text-align:center;
font-size:20px;
margin-bottom:40px;
}

/* FOOTER */

footer{
background:#1e2a38;
color:white;
text-align:center;
padding:15px;
margin-top:40px;
}

</style>
</head>

<body>

<!-- HEADER -->

<header>

<div class="logo">💰 Budget Tracker</div>

<nav>
<a href="index.html">Home</a>
<a href="expense.html">Add Expense</a>
<a href="reports.html">Reports</a>
<a href="Adviser.html">Budget Planner</a>
<a href="login.html">Login</a>
</nav>

</header>

<!-- TITLE -->

<section class="title">

<h1>Add Expense</h1>
<p>Record your daily spending and track your expenses</p>

</section>

<!-- EXPENSE FORM -->

<div class="form-container">

<input type="text" id="name" placeholder="Expense Name">

<input type="number" id="amount" placeholder="Amount">

<select id="category">
<option value="">Select Category</option>
<option>Food</option>
<option>Transport</option>
<option>Shopping</option>
<option>Bills</option>
<option>Entertainment</option>
<option>Other</option>
</select>

<input type="date" id="date">

<button onclick="addExpense()">Add Expense</button>

</div>

<!-- EXPENSE TABLE -->

<div class="table-container">

<table>

<thead>

<tr>
<th>Name</th>
<th>Category</th>
<th>Amount</th>
<th>Date</th>
<th>Action</th>
</tr>

</thead>

<tbody id="expenseTable"></tbody>

</table>

</div>

<!-- TOTAL -->

<div class="total">

<h2>Total Expense: ₹ <span id="total">0</span></h2>

</div>

<!-- FOOTER -->

<footer>

<p>© 2026 Smart Budget & Expense Tracker</p>

</footer>

<script>

let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

function displayExpenses(){

let table = document.getElementById("expenseTable");
table.innerHTML = "";

let total = 0;

expenses.forEach((expense,index)=>{

total += Number(expense.amount);

table.innerHTML += `
<tr>
<td>${expense.name}</td>
<td>${expense.category}</td>
<td>₹ ${expense.amount}</td>
<td>${expense.date}</td>
<td><button class="delete-btn" onclick="deleteExpense(${index})">Delete</button></td>
</tr>
`;

});

document.getElementById("total").innerText = total;

localStorage.setItem("expenses",JSON.stringify(expenses));

}

function addExpense(){

let name = document.getElementById("name").value;
let amount = document.getElementById("amount").value;
let category = document.getElementById("category").value;
let date = document.getElementById("date").value;

if(name=="" || amount=="" || category=="" || date==""){
alert("Please fill all fields");
return;
}

expenses.push({name,amount,category,date});

displayExpenses();

document.getElementById("name").value="";
document.getElementById("amount").value="";
document.getElementById("category").value="";
document.getElementById("date").value="";

}

function deleteExpense(index){

expenses.splice(index,1);

displayExpenses();

}

displayExpenses();

</script>

</body>
</html>
